server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000}


spoonacular:
  api:
    key: ${SPOONACULAR_API_KEY} # obligatorio en prod
    base-url: ${SPOONACULAR_BASE_URL:https://api.spoonacular.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    '[com.foodhelp.api]': INFO
    '[org.hibernate.SQL]': ERROR
    '[org.hibernate.type.descriptor.sql]': ERROR
