spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/foodhelp}
    username: ${POSTGRES_USER:postgresql}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false # solo se activa en el perfil prod
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  cache:
    cache-names: recetas
    caffeine:
      spec: maximumSize=500,expireAfterWrite=6h
  jpa:
    open-in-view: false 
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true # solo desarrollo; el perfil prod lo desactiva
    properties:
      hibernate:
        '[format_sql]': true

app:
  zona-horaria: ${APP_TIMEZONE:America/Santiago}
  monitor:
    cron: "0 0 8 * * ?"
  limites:
    login:
      max-intentos: ${APP_LIMITES_LOGIN_MAX:10}
      ventana-minutos: ${APP_LIMITES_LOGIN_VENTANA:5}
    unirse:
      max-intentos: ${APP_LIMITES_UNIRSE_MAX:10}
      ventana-minutos: ${APP_LIMITES_UNIRSE_VENTANA:10}

jwt:
  secret: ${JWT_SECRET} 
  expiration: ${JWT_EXPIRATION:604800000}

spoonacular:
  api:
    key: ${SPOONACULAR_API_KEY:}
    base-url: ${SPOONACULAR_BASE_URL:https://api.spoonacular.com}