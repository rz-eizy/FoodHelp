name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  titulo-pr:
    name: Título del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Validar formato Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|ci|perf): [a-zA-Z0-9_ -]{1,100}$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::El título del PR debe seguir Conventional Commits. Recibido: $PR_TITLE"
            exit 1
          fi

  quality:
    name: Calidad de código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Ejecuta ktlint:check
      - name: ktlint
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp validate

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tests + cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 7

  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: foodhelp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke Docker (prod + Flyway)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodhelp
          POSTGRES_USER: foodhelp
          POSTGRES_PASSWORD: ci-password-no-secreto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodhelp -d foodhelp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen (cargada en el runner)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          push: false
          tags: foodhelp-backend:ci
          cache-from: type=gha

      - name: Arrancar contenedor con perfil prod
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_SECRET"
          docker run -d --name foodhelp --network host \
            -e POSTGRES_URL=jdbc:postgresql://localhost:5432/foodhelp \
            -e POSTGRES_USER=foodhelp \
            -e POSTGRES_PASSWORD=ci-password-no-secreto \
            -e JWT_SECRET="$JWT_SECRET" \
            -e SPOONACULAR_API_KEY=dummy \
            foodhelp-backend:ci

      - name: Esperar /actuator/health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicación saludable"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' foodhelp)" != "true" ]; then
              break
            fi
            sleep 3
          done
          docker logs foodhelp || true
          exit 1

      - name: Verificar que no corre como root
        run: test "$(docker exec foodhelp id -u)" != "0"

      - name: Logs del contenedor (si falla)
        if: failure()
        run: docker logs foodhelp
